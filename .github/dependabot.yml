version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # `astro check` (@astrojs/check) only supports TypeScript ^5 || ^6.
      # Drop this once https://github.com/withastro/roadmap/discussions/1321 lands.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
