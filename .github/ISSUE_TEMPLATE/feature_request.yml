name: Feature request
description: Propose a change to the template.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: What can't you do, or what is harder than it should be, with the template today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see? Mention alternatives you considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Content model / Keystatic
        - Internationalization
        - Styling / design tokens
        - Animation (GSAP, Lenis)
        - Forms
        - SEO / metadata
        - Build / deployment / CI
        - Documentation
        - Other
